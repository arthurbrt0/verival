name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes + cobertura de linha e ramo (mínimo 95%)
        run: pytest --cov=roman_numerals --cov-branch --cov-report=term-missing --cov-fail-under=95
        env:
          PYTHONPATH: src

  mutation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análise de mutação (relatório como artefato)
        run: python tools/mutation_test.py --write docs/mutation_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: docs/mutation_report.md
